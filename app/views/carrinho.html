{% extends 'base.html' %}

{% block conteudo %}
<div class="page-wide">
    <h2>Meu Carrinho</h2>
    <div id="area-carrinho" class="table-wrap"></div>

    <!-- Configuração de Entrega -->
    <div id="bloco-entrega" style="margin-top: 1.5rem; padding: 1.4rem; background: var(--creme); border-radius: 18px; border: 2px solid var(--rosa-claro);">
        <h3 style="margin-bottom: .8rem;">🚚 Opção de Recebimento</h3>
        <div style="display: flex; gap: 1.5rem; flex-wrap: wrap; margin-bottom: 1rem;">
            <label style="display:flex; align-items:center; gap:.5rem; margin:0; cursor:pointer;">
                <input type="radio" name="tipo_entrega" value="Retirada" checked style="width:auto;">
                <strong>Retirada na Dark Kitchen</strong> (Grátis)
            </label>
            <label style="display:flex; align-items:center; gap:.5rem; margin:0; cursor:pointer;">
                <input type="radio" name="tipo_entrega" value="Entrega" style="width:auto;">
                <strong>Entrega Delivery</strong> (+ R$ 8,00)
            </label>
        </div>

        <div id="campo-endereco-entrega" style="display: none;">
            <label for="endereco-entrega">Endereço Completo para Entrega (Rua, Número, Bairro e Complemento)</label>
            <input type="text" id="endereco-entrega" placeholder="Ex: Rua das Flores, 123 - Apto 42 - Centro">
        </div>
    </div>

    <button id="btn-finalizar" class="btn btn-vinho">Finalizar Pedido</button>

    <hr style="margin: 2.5rem 0; border-color: var(--rosa-claro);">
    <h2>Meus Pedidos (Status da Cozinha)</h2>
    <div id="lista-meus-pedidos"></div>
</div>
{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', filename='js/carrinho.js') }}"></script>
{% endblock %}
