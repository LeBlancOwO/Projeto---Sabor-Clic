{% extends 'base.html' %}

{% block conteudo %}

<div class="page-wide">
    <h2>Cardápio</h2>
    <a class="btn btn-vinho" href="{{url_for('cardapio.novo_prato')}}">Adicionar Prato</a>

    <div class="table-wrap">
        <table>
            <thead>
                <tr>
                    <th>Id</th>
                    <th>Nome</th>
                    <th>Ingredientes</th>
                    <th>Valor unitário</th>
                </tr>
            </thead>
            <tbody>
                {% for prato in pratos %}
                <tr>
                    <td>{{ prato[0] }}</td>
                    <td>{{ prato[1] }}</td>
                    <td>{{ prato[2] }}</td>
                    <td>{{ prato[3] }}</td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</div>

{% endblock %}
