{% extends 'base.html' %}

{% block conteudo %}

<div class="page-card">
    <h2>Login</h2>
    <h3>Faça seu login:</h3>

    <form action="/login/logar" method="POST">
        <label for="email">Email</label>
        <input id="email" name="email" type="email" placeholder="Ex:teste@gmail.com" required>

        <label for="cpf">CPF</label>
        <input id="cpf" name="cpf" type="text" placeholder="Ex: 000.000.000-00" required>

        <label for="senha">Senha</label>
        <input id="senha" name="senha" type="password" placeholder="Mínimo de 8 caracteres" required>

        <label for="nivel">Nível de acesso</label>
        <select id="nivel" name="nivel_acesso">
            <option>Administrador</option>
            <option>Cozinheiro</option>
            <option>Cliente</option>
        </select>

        <button class="btn btn-vinho" type="submit">Entrar</button>
    </form>

    <p class="link-extra"><a href="{{url_for('cadastro.renderizar_cadastro')}}">Não tem uma conta? Cadastre-se</a></p>
</div>

{% endblock %}
