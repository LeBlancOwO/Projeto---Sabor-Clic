{% extends 'base.html' %}

{% block conteudo %}

<h2>Cadastro</h2>
<h3>Faça seu cadastro</h3>
<br><br>

<form action="/cadastro/cadastrar" method="POST">

    <label>Nome</label>
    <br>
    <input name="nome" type="text" placeholder="Ex: Maria Silva de Andrade" required>
    <br><br>

    <label>Email</label>
    <br>
    <input name="email" type="email" placeholder="Ex: aleatorio@gmail.com" required>
    <br><br>

    <label>CPF</label>
    <br>
    <input name="cpf" type="text" placeholder="Ex: 000.000.000-00" required>
    <br><br>

    <label>Senha</label>
    <br>
    <input name="senha" type="password" placeholder="Mínimo de 8 caracteres" required>
    <br><br>

    <label>Nível de  acesso</label>
    <br>
    <select name="nivel_acesso">
        <option>Administrador</option>
        <option>Cozinheiro</option>
        <option>Cliente</option>
    </select>
    <br><br>

    <button type="submit">Criar</button>

</form>

{% endblock %}
