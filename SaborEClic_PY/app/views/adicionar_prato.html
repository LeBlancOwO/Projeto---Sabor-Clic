{% extends 'base.html' %}

{% block conteudo %}

Adicionar Prato
<br><br>

<form action="/cardapio/adicionar" method = "POST">

    <label>Nome do prato</label>
    <br>
    <input name="nome_prato" type="text" required>
    <br><br>

    <label>Descrição do prato</label>
    <br>
    <input name="ingredientes" type="text" required>
    <br><br>

    <label>Valor do prato</label>
    <br>
    <input name="valor_unitario" type="text" required>
    <br><br>

    <label>Imagem do prato</label>
    <br>
    <input name="img_prato">
    <br><br>

    <button type="submit">Adicionar prato</button>

</form>

{% endblock %}
